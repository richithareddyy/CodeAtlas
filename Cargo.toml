[workspace]
resolver = "2"
members = ["crates/analyzer", "crates/cli", "crates/explain", "crates/server", "crates/store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
codeatlas-analyzer = { path = "crates/analyzer" }
codeatlas-store = { path = "crates/store" }
codeatlas-explain = { path = "crates/explain" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
ignore = "0.4"
neo4rs = "=0.8.0"
# Plain HTTP only: the model server is local (Ollama).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
