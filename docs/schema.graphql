type AffectedGroup {
	"""
	File path or module ID.
	"""
	name: String!
	symbols: Int!
	tests: Int!
}

type AffectedSymbol {
	symbol: SymbolRef!
	depth: Int!
	confidence: Confidence!
	"""
	From this symbol to a changed symbol.
	"""
	path: [EvidenceStep!]!
}

type AffectedTest {
	test: SymbolRef!
	depth: Int!
	"""
	From the test to the changed symbol.
	"""
	path: [EvidenceStep!]!
}

type AggregateDependency {
	"""
	File path or module ID on the other end.
	"""
	target: String!
	"""
	Number of symbol-level edges behind the dependency.
	"""
	weight: Int!
	via: [String!]!
}

type ArchitectureEdge {
	from: String!
	to: String!
	"""
	Number of symbol-level edges aggregated into this one.
	"""
	weight: Int!
	via: [String!]!
}

type ArchitectureGraph {
	level: ArchitectureLevel!
	nodes: [ArchitectureNode!]!
	edges: [ArchitectureEdge!]!
}

enum ArchitectureLevel {
	CRATE
	MODULE
	FILE
}

type ArchitectureNode {
	"""
	Crate name, module ID or file path.
	"""
	id: String!
	fanIn: Int!
	fanOut: Int!
	inCycle: Boolean!
}

enum ChangeKind {
	MODIFIED
	ADDED
	REMOVED
	"""
	Same code under a new ID (e.g. after a file rename).
	"""
	MOVED
}

type ChangedFile {
	status: FileStatus!
	path: String!
	"""
	Previous path of a renamed file.
	"""
	oldPath: String
	"""
	A Rust file, so its symbols were compared.
	"""
	rust: Boolean!
	hunks: [Hunk!]!
}

type Commit {
	sha: String!
	date: String!
	subject: String!
}

enum Confidence {
	CERTAIN
	POSSIBLE
}

"""
A Cargo build target.
"""
type Crate {
	id: ID!
	name: String!
	package: String!
	"""
	`lib`, `bin`, `test`, `example`, `bench` or `buildscript`.
	"""
	kind: String!
	rootFile: String!
	"""
	Module symbol at the root of the crate, if it was analysed.
	"""
	rootModule: ID
}

type Cycle {
	members: [String!]!
	"""
	A shortest cycle through the members; the last hop returns to the start.
	"""
	hops: [Hop!]!
}

enum DependencyKind {
	"""
	`source` calls `target`.
	"""
	CALLS
	"""
	Calls to the trait method `source` may dispatch to `target`.
	"""
	DISPATCHES_TO
	"""
	`source` implements the changed trait method `target`.
	"""
	IMPLEMENTS
	"""
	`source` has an ambiguous call with `target` as a candidate.
	"""
	MAY_CALL
}

type DependencyPath {
	nodes: [Symbol!]!
	edges: [GraphEdge!]!
}

enum DiffSide {
	HEAD
	BASE
}

type DiffSummary {
	filesChanged: Int!
	filesAdded: Int!
	filesRemoved: Int!
	filesModified: Int!
	filesRenamed: Int!
	"""
	Functions and methods, tests excluded.
	"""
	functionsAdded: Int!
	functionsRemoved: Int!
	functionsModified: Int!
	testsAdded: Int!
	testsRemoved: Int!
	testsModified: Int!
	"""
	Structs, enums and traits.
	"""
	typesAdded: Int!
	typesRemoved: Int!
	typesModified: Int!
	signaturesChanged: Int!
	moved: Int!
	"""
	Symbols where only whitespace or comments changed.
	"""
	cosmetic: Int!
	downstreamSymbols: Int!
	possibleSymbols: Int!
	affectedModules: Int!
	affectedFiles: Int!
	affectedTests: Int!
	untestedChanges: Int!
}

enum Direction {
	"""
	What the symbol depends on (callees).
	"""
	DEPENDENCIES
	"""
	What depends on the symbol (callers).
	"""
	DEPENDENTS
}

"""
A symbol the diff did not change that depends on one it did.
"""
type DownstreamSymbol {
	symbol: SymbolRef!
	depth: Int!
	confidence: Confidence!
	"""
	From this symbol to a changed symbol.
	"""
	path: [EvidenceStep!]!
	"""
	Revision the chain comes from: `BASE` for dependents of removed
	code, whose line numbers refer to the base revision.
	"""
	revision: DiffSide!
}

type EvidenceRef {
	from: ID!
	to: ID!
	relation: String!
	file: String!
	line: Int!
}

enum EvidenceStatus {
	"""
	The facts answer the question.
	"""
	SUFFICIENT
	"""
	The answer depends on ambiguous calls.
	"""
	POSSIBLE
	"""
	No chain of facts answers the question.
	"""
	INSUFFICIENT
}

type EvidenceStep {
	"""
	The dependent side (further from the change).
	"""
	source: ID!
	"""
	The side closer to the change.
	"""
	target: ID!
	kind: DependencyKind!
	file: String!
	lines: [Int!]!
	resolution: String
}

type EvidenceSymbol {
	id: ID!
	qualifiedName: String!
	shortName: String!
	file: String!
	line: Int!
}

type Explanation {
	question: String!
	status: EvidenceStatus!
	"""
	Why the evidence is insufficient, if it is.
	"""
	reason: String
	facts: [Fact!]!
	"""
	Chains as fact IDs, from the affected symbol to the change.
	"""
	chains: [[String!]!]!
	symbols: [EvidenceSymbol!]!
	"""
	The explanation, citing facts as `[E1]`.
	"""
	text: String!
	source: TextSource!
	"""
	The model that was asked, if one was.
	"""
	model: String
	verification: Verification
	"""
	A model answer that failed the check, kept for transparency.
	"""
	rejectedText: String
	notes: [String!]!
}

"""
One numbered fact found by static analysis.
"""
type Fact {
	"""
	`E1`, `E2`, ...
	"""
	id: String!
	kind: FactKind!
	"""
	The dependent side, for relationships.
	"""
	sourceId: ID
	"""
	The side closer to the change, for relationships.
	"""
	targetId: ID
	file: String
	lines: [Int!]!
	text: String!
}

enum FactKind {
	CALLS
	DISPATCHES_TO
	IMPLEMENTS
	"""
	An ambiguous call: one of several possible targets.
	"""
	MAY_CALL
	"""
	A count from the impact report.
	"""
	SUMMARY
}

enum FileStatus {
	ADDED
	REMOVED
	MODIFIED
	RENAMED
}

type GitImpactReport {
	base: Revision!
	head: Revision!
	files: [ChangedFile!]!
	symbols: [SymbolChange!]!
	"""
	Touched by the diff, but only whitespace or comments changed.
	"""
	cosmetic: [SymbolRef!]!
	maxDepth: Int!
	includeAmbiguous: Boolean!
	downstream: [DownstreamSymbol!]!
	affectedFiles: [AffectedGroup!]!
	affectedModules: [AffectedGroup!]!
	tests: [ID!]!
	"""
	Modified functions and methods that no test reaches.
	"""
	untested: [SymbolRef!]!
	truncated: Boolean!
	summary: DiffSummary!
	"""
	Time to analyse both revisions and compare them.
	"""
	analysisMs: Float!
}

type GitRef {
	name: String!
	kind: RefKind!
	"""
	Commit the ref points to.
	"""
	sha: String!
	date: String!
	subject: String!
}

"""
Revisions available for `gitImpact`, read from the repository on the
server.
"""
type GitRefs {
	"""
	Checked-out branch, `null` when detached.
	"""
	currentBranch: String
	headSha: String
	"""
	Most recently committed first.
	"""
	refs: [GitRef!]!
	"""
	Recent commits reachable from `HEAD`.
	"""
	commits: [Commit!]!
}

type GraphEdge {
	from: ID!
	to: ID!
	relation: Relation!
	"""
	How the edge was resolved (`import`, `receiver_type`, ...); absent
	for ambiguous-call candidates.
	"""
	resolution: String
	"""
	Source lines in the `from` symbol's file.
	"""
	lines: [Int!]!
}

type Hop {
	from: String!
	to: String!
	weight: Int!
	via: [String!]!
	evidence: [EvidenceRef!]!
}

type Hotspot {
	name: String!
	fanIn: Int!
	fanOut: Int!
	betweenness: Float!
}

"""
A zero-context diff hunk. A pure deletion has `newLines = 0`, and
`newStart` is the line after which the lines were removed.
"""
type Hunk {
	oldStart: Int!
	oldLines: Int!
	newStart: Int!
	newLines: Int!
}

enum ImpactLevel {
	LOW
	MEDIUM
	HIGH
}

type ImpactReport {
	changed: [SymbolRef!]!
	maxDepth: Int!
	includeAmbiguous: Boolean!
	directCount: Int!
	indirectCount: Int!
	possibleCount: Int!
	affected: [AffectedSymbol!]!
	files: [AffectedGroup!]!
	modules: [AffectedGroup!]!
	tests: [ID!]!
	truncated: Boolean!
	score: ImpactScore!
}

"""
Size of the affected graph (0–100) as a sum of factor contributions.
Not a probability of breakage.
"""
type ImpactScore {
	total: Float!
	level: ImpactLevel!
	factors: [ScoreFactor!]!
}

enum IndexMode {
	"""
	The whole graph was written.
	"""
	FULL
	"""
	Only the difference to the previously stored graph was written.
	"""
	INCREMENTAL
}

type IndexResult {
	repository: Repository!
	filesAnalyzed: Int!
	"""
	Nodes and relationships stored after the write.
	"""
	nodes: Int!
	relationships: Int!
	resolutionRate: Float
	analysisMs: Float!
	writeMs: Float!
	mode: IndexMode!
	"""
	Why the whole graph was written (`null` for incremental writes):
	`requested`, `not_indexed`, `no_state` or `index_changed`.
	"""
	fullReason: String
	"""
	Rust files whose content changed since the previous index (including
	added ones); `filesParsed` were read and parsed, `filesReused` taken
	from the saved state.
	"""
	filesChanged: Int!
	filesRemoved: Int!
	filesParsed: Int!
	filesReused: Int!
	"""
	Size of the write; for full writes everything counts as added.
	"""
	nodesAdded: Int!
	nodesRemoved: Int!
	nodesChanged: Int!
	relationshipsAdded: Int!
	relationshipsRemoved: Int!
	relationshipsChanged: Int!
}

type Layer {
	layer: Int!
	members: [String!]!
}

enum Level {
	FUNCTION
	FILE
	MODULE
}

type LineRange {
	start: Int!
	end: Int!
}

type Mutation {
	"""
	Analyses a local path or Git URL (as seen by the server) and stores
	its graph. When the repository was indexed before by this server,
	only changed files are parsed and only the difference to the stored
	graph is written; `full: true` rewrites everything.
	"""
	indexRepository(source: String!, full: Boolean! = false): IndexResult!
	"""
	Deletes a repository's graph. Returns `true` when it existed.
	"""
	removeRepository(id: ID!): Boolean!
}

type Neighborhood {
	root: Symbol!
	direction: Direction!
	maxDepth: Int!
	nodes: [NeighborhoodNode!]!
	edges: [GraphEdge!]!
	"""
	Set when node or row limits cut the traversal short.
	"""
	truncated: Boolean!
}

type NeighborhoodNode {
	symbol: Symbol!
	depth: Int!
	"""
	The edge through which the node was first reached; following these
	edges back gives a shortest evidence path to the root.
	"""
	via: GraphEdge!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type Query {
	"""
	All indexed repositories.
	"""
	repositories: [Repository!]!
	"""
	A repository by ID or unique name; `null` if unknown.
	"""
	repository(id: ID!): Repository
	"""
	A symbol by exact ID; `null` if unknown.
	"""
	symbol(repoId: ID!, id: ID!): Symbol
	"""
	Symbols whose name or qualified name matches every term of `query`
	as a prefix. Exact name matches come first. Cursor-paginated with
	`first` (at most 50) and `after`.
	"""
	searchSymbols(repoId: ID!, query: String!, kinds: [SymbolKind!], first: Int, after: String): SymbolConnection!
	"""
	Build targets of a repository (libraries first) with their root modules.
	"""
	crates(repoId: ID!): [Crate!]!
	"""
	Direct children of a symbol: items of a module, methods of a type.
	"""
	children(repoId: ID!, id: ID!): [Symbol!]!
	"""
	Whole-repository dependency graph at crate, module or file level.
	"""
	architectureGraph(repoId: ID!, level: ArchitectureLevel! = MODULE): ArchitectureGraph!
	"""
	What `symbolId` depends on, breadth-first up to `depth`.
	"""
	dependencies(repoId: ID!, symbolId: ID!, depth: Int! = 1, relations: [Relation!]! = [CALLS]): Neighborhood!
	"""
	What depends on `symbolId`, breadth-first up to `depth`.
	"""
	dependents(repoId: ID!, symbolId: ID!, depth: Int! = 1, relations: [Relation!]! = [CALLS]): Neighborhood!
	"""
	Shortest dependency path from `from` to `to` over resolved calls,
	imports and implementations; `null` if none within `maxDepth`.
	"""
	dependencyPath(repoId: ID!, from: ID!, to: ID!, maxDepth: Int! = 10): DependencyPath
	"""
	Files depending on `path` (`DEPENDENTS`) or that it depends on.
	"""
	fileDependencies(repoId: ID!, path: String!, direction: Direction!): [AggregateDependency!]!
	"""
	Modules depending on `moduleId` (`DEPENDENTS`) or that it depends on.
	"""
	moduleDependencies(repoId: ID!, moduleId: ID!, direction: Direction!): [AggregateDependency!]!
	"""
	What could be affected by changing `symbolId` (types, traits and
	modules include their members) or every symbol in `file`, and why.
	"""
	impact(repoId: ID!, symbolId: ID, file: String, maxDepth: Int! = 8, includeAmbiguous: Boolean! = false): ImpactReport!
	"""
	Tests affected by changing `symbolId`, with the chain from each test
	to the change (follows calls and trait dispatch).
	"""
	affectedTests(repoId: ID!, symbolId: ID!, maxDepth: Int! = 8): [AffectedTest!]!
	"""
	Tests to run when the given symbols change (types and modules
	include their members): direct and transitive tests with the chain
	to the change, and changed code that no test reaches.
	"""
	testImpact(repoId: ID!, symbolIds: [ID!]!, maxDepth: Int! = 8, includeAmbiguous: Boolean! = false): TestSelection!
	"""
	Why changing `symbolId` can affect `affectedId`, or with no
	`affectedId` what changing it affects, as numbered facts from the
	graph and an explanation that cites them. The explanation is written
	by the configured local model when `useModel` is true and one
	answers, and only if it passes the check against the facts;
	otherwise it is built from the facts directly. Insufficient evidence
	is never sent to a model.
	"""
	explainImpact(repoId: ID!, symbolId: ID!, affectedId: ID, maxDepth: Int! = 8, useModel: Boolean! = true): Explanation!
	"""
	Strongly connected components at the given level, largest first.
	"""
	circularDependencies(repoId: ID!, level: Level! = MODULE): [Cycle!]!
	"""
	Most central nodes by betweenness, then fan-in.
	"""
	hotspots(repoId: ID!, level: Level! = FUNCTION, first: Int! = 15): [Hotspot!]!
	"""
	Dependency layers, foundations (layer 0) first.
	"""
	layers(repoId: ID!, level: Level! = MODULE): [Layer!]!
	"""
	Branches, tags and recent commits of the repository on the server,
	for choosing what `gitImpact` compares.
	"""
	gitRefs(repoId: ID!, first: Int! = 50): GitRefs!
	"""
	What changed between `base` and `head` (a branch, tag, SHA or
	expression such as `HEAD~1`; the working tree when `head` is null),
	symbol by symbol, and what else the changes could affect. Both
	revisions are analysed from the repository's Git history on the
	server; the stored graph is not used.
	"""
	gitImpact(repoId: ID!, base: String!, head: String, maxDepth: Int! = 8, includeAmbiguous: Boolean! = false): GitImpactReport!
	"""
	Source lines of a repository file (at most 400 per request), read
	from the repository's working tree on the server.
	"""
	source(repoId: ID!, file: String!, startLine: Int!, endLine: Int!): SourceSnippet!
}

enum RefKind {
	BRANCH
	REMOTE_BRANCH
	TAG
}

enum Relation {
	CALLS
	CALLS_CANDIDATE
	IMPORTS
	IMPLEMENTS
}

type Repository {
	id: ID!
	name: String!
	"""
	Working-tree path on the server.
	"""
	root: String!
	originUrl: String
	branch: String
	headSha: String
	"""
	Commit the stored graph was built from.
	"""
	indexedSha: String
	indexedAt: String!
	formatVersion: Int!
	sourceFiles: Int!
	loc: Int!
	languages: [String!]!
}

type Revision {
	"""
	As requested (`main`, `HEAD~2`, ...) or `working tree`.
	"""
	label: String!
	"""
	`null` for the working tree.
	"""
	sha: String
}

type ScoreFactor {
	name: String!
	value: Int!
	saturation: Int!
	weight: Float!
	normalized: Float!
	contribution: Float!
}

type SelectedTest {
	test: SymbolRef!
	"""
	Length of the evidence chain.
	"""
	depth: Int!
	"""
	Call steps in the chain; 1 for direct tests.
	"""
	calls: Int!
	confidence: Confidence!
	"""
	From the test to a changed symbol.
	"""
	path: [EvidenceStep!]!
	"""
	Changed symbols the test reaches.
	"""
	reaches: [ID!]!
}

type SignatureChange {
	before: String!
	after: String!
}

type SourceSnippet {
	file: String!
	startLine: Int!
	endLine: Int!
	totalLines: Int!
	lines: [String!]!
}

type Symbol {
	id: ID!
	kind: SymbolKind!
	name: String!
	qualifiedName: String!
	file: String!
	crateName: String!
	startLine: Int!
	endLine: Int!
	visibility: String!
	signature: String
	isTest: Boolean!
	unresolvedCalls: [UnresolvedCall!]!
}

type SymbolChange {
	change: ChangeKind!
	"""
	The symbol in the head revision (the base revision for removed ones).
	"""
	symbol: SymbolRef!
	"""
	The symbol in the base revision, for modified and moved symbols.
	"""
	previous: SymbolRef
	signature: SignatureChange
	"""
	Changed lines inside the symbol, in `symbol.file`.
	"""
	lines: [LineRange!]!
}

type SymbolConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [SymbolEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Symbol!]!
}

"""
An edge in a connection.
"""
type SymbolEdge {
	"""
	The item at the end of the edge
	"""
	node: Symbol!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

enum SymbolKind {
	MODULE
	STRUCT
	ENUM
	TRAIT
	FUNCTION
	METHOD
}

type SymbolRef {
	id: ID!
	kind: SymbolKind!
	qualifiedName: String!
	file: String!
	line: Int!
	isTest: Boolean!
}

"""
Tests to run for a change.
"""
type TestSelection {
	"""
	Changed symbols, with types and modules expanded to their members.
	"""
	changed: [SymbolRef!]!
	"""
	Tests among the changed symbols.
	"""
	changedTests: [SymbolRef!]!
	"""
	Tests calling changed code directly.
	"""
	direct: [SelectedTest!]!
	"""
	Tests reaching changed code through other code.
	"""
	transitive: [SelectedTest!]!
	"""
	Tests reached only through ambiguous calls (when requested).
	"""
	possible: [SelectedTest!]!
	"""
	Changed functions and methods no test reaches.
	"""
	untested: [SymbolRef!]!
	totalTests: Int!
	truncated: Boolean!
}

enum TextSource {
	"""
	Written by the language model and accepted by the check.
	"""
	MODEL
	"""
	Built from the facts without a model.
	"""
	TEMPLATE
}

"""
A call inside a symbol that could not be resolved.
"""
type UnresolvedCall {
	line: Int!
	callee: String!
	"""
	e.g. `name_not_in_scope`, `dynamic_call`.
	"""
	reason: String!
}

"""
The check of a model answer against the facts.
"""
type Verification {
	accepted: Boolean!
	"""
	Fact IDs the answer cites.
	"""
	cited: [String!]!
	"""
	Why the answer was rejected.
	"""
	problems: [String!]!
	warnings: [String!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}

