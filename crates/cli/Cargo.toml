[package]
name = "codeatlas-cli"
description = "Command-line interface for CodeAtlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "codeatlas"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
codeatlas-analyzer.workspace = true
codeatlas-explain.workspace = true
codeatlas-store.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["resource"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
