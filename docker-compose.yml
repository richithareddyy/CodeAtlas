# Local Neo4j for CodeAtlas. Credentials come from `.env` (see `.env.example`).
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "${CODEATLAS_NEO4J_HTTP_PORT:-7474}:7474"
      - "${CODEATLAS_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${CODEATLAS_NEO4J_PASSWORD:?set CODEATLAS_NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  neo4j-data:
