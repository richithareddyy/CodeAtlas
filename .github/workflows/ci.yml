name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Throwaway credential for the per-run Neo4j service container.
  CODEATLAS_NEO4J_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
  CODEATLAS_NEO4J_URI: bolt://localhost:7687
  # Re-record the test-impact ground truth (builds and runs a fixture).
  CODEATLAS_RUN_PROBES: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The equivalence tests need a real repository. The pin is the one the
      # external evaluation uses; they compare HEAD with HEAD~10.
      - name: Read the pinned ripgrep commit
        id: ripgrep
        run: |
          commit=$(jq -er '.repositories[] | select(.name == "ripgrep") | .commit' benchmarks/external/repos.json)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: ripgrep-cache
        with:
          path: ${{ runner.temp }}/ripgrep
          key: ripgrep-depth11-${{ steps.ripgrep.outputs.commit }}
      - name: Shallow-clone ripgrep
        if: steps.ripgrep-cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.ripgrep.outputs.commit }}
        run: |
          git init -q "$RUNNER_TEMP/ripgrep"
          cd "$RUNNER_TEMP/ripgrep"
          git remote add origin https://github.com/BurntSushi/ripgrep
          git fetch -q --depth 11 origin "$COMMIT"
          git checkout -q --detach FETCH_HEAD
      - name: Check the ripgrep clone
        env:
          COMMIT: ${{ steps.ripgrep.outputs.commit }}
        run: |
          cd "$RUNNER_TEMP/ripgrep"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git rev-parse --verify --quiet 'HEAD~10^{commit}'
      - run: cargo test --all
        env:
          CODEATLAS_EQUIVALENCE_REPO: ${{ runner.temp }}/ripgrep

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
